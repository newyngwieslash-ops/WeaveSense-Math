services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_ai_canvas}
      POSTGRES_USER: ${POSTGRES_USER:-open_ai_canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行一键部署脚本生成数据库密码}
    volumes:
      - ${CANVAS_POSTGRES_DATA_PATH:-postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ${CANVAS_REDIS_DATA_PATH:-redis-data}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ${CANVAS_BACKEND_IMAGE:?请先配置 CANVAS_BACKEND_IMAGE（必须包含镜像 digest）}
    entrypoint: ["migrate-schema"]
    command: ["up"]
    environment:
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_DATABASE_DRIVER: postgres
      DATABASE_URL: ${MIGRATE_DATABASE_URL:-${DATABASE_URL:?请先运行一键部署脚本生成数据库连接}}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-app-role:
        condition: service_completed_successfully

  postgres-app-role:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-open_ai_canvas}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请先运行一键部署脚本生成数据库密码}
      PGDATABASE: ${POSTGRES_DB:-open_ai_canvas}
      POSTGRES_USER: ${POSTGRES_USER:-open_ai_canvas}
      APP_DB_USER: ${APP_DB_USER:-flow_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?请先配置应用角色口令 APP_DB_PASSWORD}
    volumes:
      - ${CANVAS_ENSURE_APP_ROLE_SCRIPT:-./deploy/postgres/ensure-app-role.sh}:/ensure-app-role.sh:ro
    entrypoint: ["/bin/sh", "/ensure-app-role.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres-app-grants:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-open_ai_canvas}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请先运行一键部署脚本生成数据库密码}
      PGDATABASE: ${POSTGRES_DB:-open_ai_canvas}
      POSTGRES_USER: ${POSTGRES_USER:-open_ai_canvas}
      APP_DB_USER: ${APP_DB_USER:-flow_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?请先配置应用角色口令 APP_DB_PASSWORD}
    volumes:
      - ${CANVAS_ENSURE_APP_ROLE_SCRIPT:-./deploy/postgres/ensure-app-role.sh}:/ensure-app-role.sh:ro
    entrypoint: ["/bin/sh", "/ensure-app-role.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  math:
    image: ${CANVAS_MATH_IMAGE:?请先配置 CANVAS_MATH_IMAGE（必须包含镜像 digest）}
    environment:
      MATH_SERVICE_KEY: ${MATH_SERVICE_KEY:?请先配置 MATH_SERVICE_KEY（至少 32 字节）}
      MATH_DATA_DIR: /data
      MATH_LISTEN: ${MATH_LISTEN:-0.0.0.0:8790}
      MATH_EVENT_URL: ${MATH_EVENT_URL:-http://backend:8080/api/edu-math-events}
    volumes:
      - ${CANVAS_MATH_DATA_PATH:-math-data}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  yingce-agent:
    # 让旧更新器也能完成本次升级；新版更新器在后续更新中会固定为镜像 digest。
    image: ${CANVAS_YINGCE_AGENT_IMAGE:-ghcr.io/ddcat-ai/open-ai-canvas-yingce-agent:${CANVAS_IMAGE_TAG:?请先配置 CANVAS_IMAGE_TAG}}
    environment:
      YINGCE_AGENT_TOKEN: ${YINGCE_AGENT_TOKEN:-${CANVAS_UPDATER_TOKEN:?请先配置 YINGCE_AGENT_TOKEN}}
      MAX_CONCURRENT_SESSIONS: ${YINGCE_AGENT_MAX_SESSIONS:-30}
      NODE_MAX_OLD_SPACE_SIZE: ${YINGCE_AGENT_NODE_MEMORY_MB:-512}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    image: ${CANVAS_BACKEND_IMAGE:?请先配置 CANVAS_BACKEND_IMAGE（必须包含镜像 digest）}
    environment:
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_AUTO_MIGRATE: "false"
      CANVAS_SHUTDOWN_TIMEOUT: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
      CANVAS_DATABASE_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL:?请先运行一键部署脚本生成数据库连接}
      REDIS_URL: redis://redis:6379/0
      FLOW_MATH_SERVICE_URL: ${FLOW_MATH_SERVICE_URL:-http://math:8790}
      FLOW_MATH_SERVICE_KEY: ${FLOW_MATH_SERVICE_KEY:-${MATH_SERVICE_KEY:?请先配置 MATH_SERVICE_KEY}}
      FLOW_PRICE_BOOK: ${FLOW_PRICE_BOOK:-}
      EDU_MATH_REQUIRE_SERVICE: ${EDU_MATH_REQUIRE_SERVICE:-1}
      EDU_MATH_JOB_BUDGET_MICRO: ${EDU_MATH_JOB_BUDGET_MICRO:-}
      EDU_PAUSE_GENERATION: ${EDU_PAUSE_GENERATION:-}
      EDU_RETENTION_EVERY: ${EDU_RETENTION_EVERY:-}
      EDU_LEDGER_RECONCILE_EVERY: ${EDU_LEDGER_RECONCILE_EVERY:-}
      EDU_METRICS_EVERY: ${EDU_METRICS_EVERY:-}
      EDU_RESTORE_JOURNAL: ${EDU_RESTORE_JOURNAL:-}
      EDU_BUDGET_TZ: ${EDU_BUDGET_TZ:-}
      EDU_ARTIFACT_URL_KEY: ${EDU_ARTIFACT_URL_KEY:-}
      EDU_APP_VERSION: ${EDU_APP_VERSION:-}
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-}
      CANVAS_PUBLIC_BASE_URL: ${CANVAS_PUBLIC_BASE_URL:-}
      CANVAS_UPDATER_SOCKET: /run/open-ai-canvas-updater/updater.sock
      CANVAS_UPDATER_TOKEN: ${CANVAS_UPDATER_TOKEN:-}
      YINGCE_AGENT_URL: http://yingce-agent:8081
      YINGCE_AGENT_TOKEN: ${YINGCE_AGENT_TOKEN:-${CANVAS_UPDATER_TOKEN:?请先配置 YINGCE_AGENT_TOKEN}}
      YINGCE_AGENT_BRIDGE_HOST: backend
      CANVAS_LOG_LEVEL: ${CANVAS_LOG_LEVEL:-info}
      CANVAS_LOG_FORMAT: ${CANVAS_LOG_FORMAT:-text}
      GIN_MODE: release
    volumes:
      - ${CANVAS_DATA_PATH:-backend-data}:/data
      - ${CANVAS_UPDATER_SOCKET_DIR:-/run/open-ai-canvas-updater}:/run/open-ai-canvas-updater
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres-app-grants:
        condition: service_completed_successfully
      math:
        condition: service_healthy
      yingce-agent:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}

  web:
    image: ${CANVAS_WEB_IMAGE:?请先配置 CANVAS_WEB_IMAGE（必须包含镜像 digest）}
    ports:
      - "${CANVAS_HTTP_PORT:-3000}:3000"
    volumes:
      # Keep hashed chunks from the current and previous web releases for old tabs.
      - ${CANVAS_WEB_DATA_PATH:-web-data}:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  postgres-data:
  redis-data:
  web-data:
  math-data:
