# Sample PostgreSQL settings for education WAL continuous archive (DEV-122).
# Copy the values you need into the deployment's postgresql.conf. Do not enable
# these on a cluster that already has a different archive_command without a
# review. RPO target is 5 minutes (archive_timeout = 300).
# ARCHIVE_DIR is the stand-in or mount for the backup bucket (U9).
wal_level = replica
archive_mode = on
archive_timeout = 300
# archive_command = 'ARCHIVE_DIR=/var/backups/edu-wal /path/to/deploy/flow/backup/wal-archive.sh %p %f'
# restore_command (recovery): 'cp /var/backups/edu-wal/%f %p'
