name: open-ai-canvas-dev

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
      args:
        GO_IMAGE: ${GO_IMAGE:-golang:1.25-alpine}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    working_dir: /workspace/backend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_DATABASE_DRIVER: ${CANVAS_DATABASE_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-http://localhost:3000}
      # 服务器访问地址：Agent 看图与生成参考图都靠它签发上游可取到的短时链接。
      CANVAS_PUBLIC_BASE_URL: ${CANVAS_PUBLIC_BASE_URL:-}
      CANVAS_LOG_LEVEL: ${CANVAS_LOG_LEVEL:-debug}
      GIN_MODE: debug
      FLOW_MATH_SERVICE_URL: ${FLOW_MATH_SERVICE_URL:-}
      FLOW_MATH_SERVICE_KEY: ${FLOW_MATH_SERVICE_KEY:-${MATH_SERVICE_KEY:-}}
      FLOW_PRICE_BOOK: ${FLOW_PRICE_BOOK:-}
      EDU_MATH_REQUIRE_SERVICE: ${EDU_MATH_REQUIRE_SERVICE:-}
      EDU_MATH_JOB_BUDGET_MICRO: ${EDU_MATH_JOB_BUDGET_MICRO:-}
      EDU_PAUSE_GENERATION: ${EDU_PAUSE_GENERATION:-}
      EDU_RETENTION_EVERY: ${EDU_RETENTION_EVERY:-}
      EDU_LEDGER_RECONCILE_EVERY: ${EDU_LEDGER_RECONCILE_EVERY:-}
      EDU_METRICS_EVERY: ${EDU_METRICS_EVERY:-}
      EDU_RESTORE_JOURNAL: ${EDU_RESTORE_JOURNAL:-}
      EDU_BUDGET_TZ: ${EDU_BUDGET_TZ:-}
      EDU_ARTIFACT_URL_KEY: ${EDU_ARTIFACT_URL_KEY:-}
      EDU_APP_VERSION: ${EDU_APP_VERSION:-}
    volumes:
      - type: bind
        source: .
        target: /workspace
      # 禁止 Compose 静默创建新数据目录，避免开发时误用另一套账号数据。
      - type: bind
        source: ./.local/project-workbench-debug
        target: /data
        bind:
          create_host_path: false
      # 持久化首次下载和 CGO 编译结果，容器重建后继续复用开发缓存。
      - type: bind
        source: ./.local/cache/go-build
        target: /tmp/go-build
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/cache/go-mod
        target: /tmp/go-mod
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${CANVAS_BACKEND_HOST_PORT:-8080}:8080"
    init: true

  web:
    image: oven/bun:1.3.13
    working_dir: /workspace/web
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run dev"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
      VITE_TLDRAW_LICENSE_KEY: ${VITE_TLDRAW_LICENSE_KEY:-}
    volumes:
      - type: bind
        source: .
        target: /workspace
      - web-node-modules:/workspace/web/node_modules
      - web-bun-cache:/root/.bun/install/cache
    ports:
      - "${CANVAS_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
    init: true

  math:
    profiles: ["edu"]
    build:
      context: .
      dockerfile: services/math-service/Dockerfile
    environment:
      MATH_SERVICE_KEY: ${MATH_SERVICE_KEY:?启动教育功能时须设置 MATH_SERVICE_KEY（至少 32 字节）}
      MATH_DATA_DIR: /data
      MATH_LISTEN: 0.0.0.0:8790
      MATH_EVENT_URL: ${MATH_EVENT_URL:-http://backend:8080/api/edu-math-events}
    volumes:
      - ${CANVAS_MATH_DATA_PATH:-math-data}:/data
    ports:
      - "127.0.0.1:${MATH_HOST_PORT:-8790}:8790"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    init: true

volumes:
  web-node-modules:
  web-bun-cache:
  math-data:
